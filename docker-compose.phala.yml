# SealedIn gateway, PHALA CLOUD topology (dstack): one TDX CVM runs this compose; the guest measures it into RTMR3
# (compose-hash event), so all images are pinned by digest and the only mount is the guest agent's socket. Gateway
# config is baked into the image (gateway/Dockerfile); the edge routing table likewise (edge/Dockerfile).
#
# Deploy/update: scripts/deploy-phala.sh. Verify: scripts/verify-gateway.sh <domain>. Clients: https://<domain>, the
# custom domain routed by SNI through the platform gateway to the edge (our certificate, endorsed by /v1/tls; DNS in
# docs/domain.md). Env vars travel
# encrypted to the CVM (scripts/env-from-keychain.sh materializes the secrets): CHUTES_API_KEY (the egress upstream),
# POSTGRES_PASSWORD, SEALEDIN_OPERATOR_API_KEY (key issuance bearer), SOLANA_RPC_API_KEY (the rpcproxy's provider), plus
# the per-operator value
# SEALEDIN_EDGE_DOMAIN as a required interpolation. The LiteLLM master key is in no env file: the identity derives it
# from the guest agent's KMS-backed GetKey (same key every boot) and hands it to the gateway and the sales service over
# the tmpfs volume `masterkey`.
#
# Three networks: `internal` (internal: true, no route out) carries every service but the rpcproxy; `egress` routes out and
# carries only the edge (ACME, inbound), the egress (Chutes) and the rpcproxy (Solana); `solana` (internal: true) joins only
# the sales service and the rpcproxy, whose params reach external hosts, so nothing else can use it as a way out. LiteLLM must
# have no path to the internet (price-map refresh, callbacks, telemetry) and Postgres none at all; a container on an
# internal network alone cannot publish ports, which is why the identity's bootstrap is reached through the edge's routing
# table, not its own port.
#
# Release: one compose, one compose-hash for every deployment; no per-deployment literal is measured.
services:
  # TLS edge: ACME HTTPS for the custom domain through the platform gateway's SNI passthrough, so the certificate is
  # ours and /v1/tls endorses it; TLS-ALPN-01 only, since :80 never passes through (HTTP-01 off, no port 80 published).
  edge:
    image: ghcr.io/sealedin/gateway-edge@sha256:f92c4db8c8d9c802428ba58bd067f62cbcbf628d3f44bfd79d308f07b5f87315
    environment:
      # &domain: single source of the app domain, shared with identity's -edge-sni; compose refuses to start unset.
      EDGE_DOMAIN: &domain "${SEALEDIN_EDGE_DOMAIN:?set SEALEDIN_EDGE_DOMAIN in the env file}"
    # /data is tmpfs: TLS keys never touch disk, ACME reissues each boot, so /v1/tls needs no nonce. Only the ACME
    # account key persists. Budget: ~5 LE duplicate certs/week, so at most ~5 CVM restarts a week.
    ports:
      - "443:443"
      # Plain listener for the platform-terminated name https://<app-id>-8080.<gateway-domain>: only the
      # self-authenticating routes and the liveness probe (see Caddyfile); inference, key info and key issuance never.
      - "8080:8080"
    tmpfs:
      - /data
    volumes:
      - caddyacme:/data/caddy/acme
    networks:
      - internal
      - egress

  gateway:
    image: ghcr.io/sealedin/gateway-gateway@sha256:eee02262ee7ac0bc70817656440e635c858c1b0a6e80027d65f64e0bdc3d9bc9
    # The gateway holds no provider key: its only upstream is the egress, which funds Chutes with CHUTES_API_KEY.
    environment:
      # Postgres enables LiteLLM virtual keys: revocable per-member keys with budgets and rate limits.
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@db:5432/litellm
      # Without this LiteLLM refreshes its price map from GitHub at startup: an unmeasured input into recorded spend.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    depends_on:
      - db
      - egress
      - identity
    # The image's entrypoint waits for the identity's key file and exports it as LITELLM_MASTER_KEY; the gateway gets
    # no agent socket, so a compromised LiteLLM can neither quote nor derive keys.
    volumes:
      - masterkey:/run/sealedin:ro
    networks:
      - internal

  # Attested egress: the gateway's upstream for TEE models. It verifies each Chutes instance against the policy baked
  # into its image and forwards end-to-end encrypted to the attested instance key; never published.
  egress:
    image: ghcr.io/sealedin/gateway-egress@sha256:7428576c3b05283ca71112402ef29574934bdc9d439a2fc17a123c3bdb908b8d
    environment:
      CHUTES_API_KEY: ${CHUTES_API_KEY:?set CHUTES_API_KEY in the env file}
    networks:
      - internal
      - egress

  # The sales service's only path to Solana: an allowlist of JSON-RPC methods to the hosts baked into its image; it holds
  # the provider's API key and no other; never published.
  rpcproxy:
    image: ghcr.io/sealedin/gateway-rpcproxy@sha256:b5bfd7ad2af7c223e8731b78528e1b982ad4555c8a7a2f5e72f9937e9507f44d
    environment:
      SOLANA_RPC_API_KEY: ${SOLANA_RPC_API_KEY:?set SOLANA_RPC_API_KEY in the env file}
    networks:
      - solana
      - egress

  # Between the edge and LiteLLM's inference routes: reads every reply to its end, so a client hanging up or stalling cannot
  # escape metering. Holds no secret and has no route out; never published.
  drain:
    image: ghcr.io/sealedin/gateway-drain@sha256:9d16a383989b7813acf1f01c9ef34a1e0844ca5d0c98ccae1dee5ed0438a2f91
    # Above the server's shutdown budget, so what is running still gets billed.
    stop_grace_period: 12m
    depends_on:
      - gateway
    networks:
      - internal

  # Sells keys over x402: parses clients' transactions and holds the operators' fee payer key, the one service that does. It
  # takes the secret behind sold keys and the master key from the identity's tmpfs volumes and has no agent socket; never published.
  sales:
    image: ghcr.io/sealedin/gateway-sales@sha256:81ebb0db5c24b3ed27c8fe44e524e139a18c91913c4bb2c488d106876547093c
    command: ["-virtual-key-secret-file", "/run/sealedin-virtualkey/virtual-key-secret", "-fee-payer-address-file", "/run/sealedin-feepayer-address/fee-payer-address", "-master-key-file", "/run/sealedin/litellm-master-key"]
    environment:
      SEALEDIN_FEE_PAYER_KEY: ${SEALEDIN_FEE_PAYER_KEY:?set SEALEDIN_FEE_PAYER_KEY in the env file}
    depends_on:
      - identity
      - gateway
      - rpcproxy
    # Above the server's shutdown budget, so a settlement in flight can finish.
    stop_grace_period: 150s
    volumes:
      - masterkey:/run/sealedin:ro
      - virtualkey:/run/sealedin-virtualkey:ro
      - feepayeraddress:/run/sealedin-feepayer-address
    networks:
      - internal
      - solana

  db:
    image: postgres@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: litellm
    volumes:
      # Named volume lands on the CVM's encrypted data disk.
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  identity:
    image: ghcr.io/sealedin/gateway-identity@sha256:8dfedbd437814f7d67f034d8b1b00a40dcc011124fa9b435ba9357f04c41dbd7
    # The signed catalog (/v1/catalog) is the image's measured price sheet; the private listener on :8473 is edge-only.
    command: ["-edge-sni", *domain, "-private-listen", ":8473"]
    environment:
      # Bearer for the operator's key issuance (/v1/keys); the identity derives the master key itself.
      SEALEDIN_OPERATOR_API_KEY: ${SEALEDIN_OPERATOR_API_KEY:?set SEALEDIN_OPERATOR_API_KEY in the env file}
    # Nothing published: the edge routes the plaintext bootstrap (/v1/quote, /v1/tls) to :8471 and the private
    # surface to :8473; the internal-only network could not publish a port anyway.
    # Quotes and the master key come from the guest agent over its socket: it holds the TDX device and the QGS
    # connection, so the container needs no device, no vsock and no seccomp change, and the image's nonroot user
    # stays in force. The only socket mount in this compose: nothing else may quote or derive keys.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - masterkey:/run/sealedin
      - virtualkey:/run/sealedin-virtualkey
      - feepayeraddress:/run/sealedin-feepayer-address:ro
    networks:
      - internal

networks:
  internal:
    internal: true
  solana:
    internal: true
  egress:

volumes:
  pgdata:
  caddyacme:
  # RAM-only hand-off of the derived master key from identity (writer) to gateway and sales (readers); never on a disk. Owned
  # by the identity image's nonroot user (65532) so it can write there; the gateway runs as root and reads it.
  masterkey:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65532,gid=65532,mode=0700,size=64k"
  # RAM-only hand-off of the secret behind sold keys from identity (writer) to sales (reader, same nonroot user); apart from
  # the master key's, since the gateway mounts that one and must never read this.
  virtualkey:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65532,gid=65532,mode=0700,size=64k"
  # The other way, and public: the fee payer's address from sales (writer) to the identity's signed catalog (reader).
  feepayeraddress:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65532,gid=65532,mode=0700,size=64k"
