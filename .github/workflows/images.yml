# Builds the gateway images for ghcr; the digests in the job summary are what the measured compose pins.
name: images
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway-identity
            context: .
            dockerfile: Dockerfile
          - name: gateway-gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - name: gateway-edge
            context: edge
            dockerfile: edge/Dockerfile
          - name: gateway-egress
            context: .
            dockerfile: Dockerfile.egress
          - name: gateway-rpcproxy
            context: .
            dockerfile: Dockerfile.rpcproxy
          - name: gateway-sales
            context: .
            dockerfile: Dockerfile.sales
          - name: gateway-drain
            context: .
            dockerfile: Dockerfile.drain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Provenance needs the docker-container buildx driver; the default docker driver cannot attach attestations.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # These images are the attestation trust root, so their own build carries SLSA provenance. No mutable
          # :latest tag: the compose pins by digest and nothing else should.
          provenance: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
      - env:
          IMAGE: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # A warning only: a build must never depend on the provider's list, and this job shares nothing with the build.
  measurements-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache on a tag-triggered workflow: a poisoned cache entry must not reach anything this run produces.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make build-sync-measurements
      - run: |
          code=0
          ./build/sync-measurements --check || code=$?
          case "$code" in
            0) ;;
            2|3) echo "::warning::egress/policy.yaml differs from the Chutes measurement list (exit $code); see the log." ;;
            *) echo "::warning::Could not compare egress/policy.yaml with the Chutes measurement list; see the log." ;;
          esac
