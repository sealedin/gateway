# Builds the gateway images for ghcr; the digests in the job summary are what the measured compose pins.
name: images
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway-identity
            context: .
            dockerfile: Dockerfile
          - name: gateway-gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - name: gateway-edge
            context: edge
            dockerfile: edge/Dockerfile
          - name: gateway-egress
            context: .
            dockerfile: Dockerfile.egress
          - name: gateway-rpcproxy
            context: .
            dockerfile: Dockerfile.rpcproxy
          - name: gateway-sales
            context: .
            dockerfile: Dockerfile.sales
          - name: gateway-drain
            context: .
            dockerfile: Dockerfile.drain
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Provenance needs the docker-container buildx driver; the default docker driver cannot attach attestations.
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # These images are the attestation trust root, so their own build carries SLSA provenance. No mutable
          # :latest tag: the compose pins by digest and nothing else should.
          provenance: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
      - run: echo "${{ matrix.name }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # A warning only: a build must never depend on the provider's list, and this job shares nothing with the build.
  measurements-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-sync-measurements
      - run: |
          code=0
          ./build/sync-measurements --check || code=$?
          case "$code" in
            0) ;;
            2|3) echo "::warning::egress/policy.yaml differs from the Chutes measurement list (exit $code); see the log." ;;
            *) echo "::warning::Could not compare egress/policy.yaml with the Chutes measurement list; see the log." ;;
          esac
