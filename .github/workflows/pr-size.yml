name: pr-size

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-size:
    runs-on: ubuntu-latest
    name: Label and gate PR size
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          xs_label: 'size/xs'
          xs_max_size: '10'
          s_label: 'size/s'
          s_max_size: '100'
          m_label: 'size/m'
          m_max_size: '400'
          l_label: 'size/l'
          l_max_size: '1000'
          xl_label: 'size/xl'
          fail_if_xl: 'true'
          message_if_xl: >
            This PR exceeds 1000 changed lines (excluding tests, docs, go.sum,
            and generated files). Please split it into smaller PRs.
          files_to_ignore: |
            *.md
            docs/**
            **/*_test.go
            go.sum
            vendor/**
            **/*.pb.go
