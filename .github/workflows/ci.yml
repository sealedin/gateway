name: ci

on:
  push:
    branches: [main, devel]
  pull_request:

env:
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: fmt
        run: test -z "$(gofmt -l -s cmd internal)"
      - name: vet
        run: go vet ./...
      - name: import isolation
        run: ./scripts/check-isolation.sh
      - name: image pins
        run: ./scripts/check-image-pins.sh
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: -c .golangci.yml
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # The gateway entrypoint derives the master key inside the CVM; stdlib only, so the runner's python3 suffices.
      - name: gateway entrypoint
        run: python3 -I -B -W error -m unittest discover -s gateway -p '*_test.py'
      # A routing-table typo must fail here, not at deploy; same pinned image the edge/Dockerfile builds from.
      - name: edge config
        run: |
          docker run --rm -v "$PWD/edge/Caddyfile:/etc/caddy/Caddyfile:ro" -e EDGE_DOMAIN=example.com \
            caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # LiteLLM bills a stream only at its end, so a client that hangs up must stay billed behind the drain.
      - name: stream billing against the pinned LiteLLM
        run: make e2e-stream-billing
      - name: build
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" ./...
